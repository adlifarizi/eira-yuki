<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 1. Channel Adapters -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="800" height="72" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="20" y="28" fill="#f9fafb" font-size="13" font-weight="600">Channel Adapters</text>
    <text x="20" y="48" fill="#9ca3af" font-size="10">Platform-specific I/O</text>

    <rect x="190" y="12" width="335" height="48" rx="6" fill="#1f2937" stroke="#4b5563"/>
    <text x="204" y="32" fill="#e5e7eb" font-size="11" font-weight="500">WhatsApp (Baileys + audioSticker Patch)</text>
    <text x="204" y="49" fill="#9ca3af" font-size="10">MentionResolver, MessagePacer, .sticker / .asticker</text>

    <rect x="540" y="12" width="240" height="48" rx="6" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="554" y="32" fill="#9ca3af" font-size="11" font-weight="500">Telegram / Discord / Web API</text>
    <text x="554" y="49" fill="#6b7280" font-size="10">Pluggable Adapters</text>
  </g>

  <!-- Arrow down -->
  <line x1="430" y1="96" x2="430" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="119" fill="#64748b" font-size="10">Normalized IncomingMessage</text>

  <!-- 2. Eira Core Brain -->
  <g transform="translate(30, 134)">
    <rect x="0" y="0" width="800" height="142" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="20" y="28" fill="#60a5fa" font-size="13" font-weight="600">Eira Core Brain (Headless)</text>
    <text x="220" y="28" fill="#9ca3af" font-size="10">Protocol-agnostic agent, commands, memory &amp; scheduling</text>

    <!-- Row 1 -->
    <rect x="20" y="44" width="242" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="32" y="61" fill="#f3f4f6" font-size="11" font-weight="500">Gatekeeper &amp; CommandRouter</text>
    <text x="32" y="76" fill="#9ca3af" font-size="10">Owner/Guest Auth, Prefix Commands</text>

    <rect x="278" y="44" width="242" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="290" y="61" fill="#f3f4f6" font-size="11" font-weight="500">Persona &amp; Mood Engine</text>
    <text x="290" y="76" fill="#9ca3af" font-size="10">system-instruction.txt &amp; 4D Mood</text>

    <rect x="536" y="44" width="244" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="548" y="61" fill="#f3f4f6" font-size="11" font-weight="500">Hierarchical Memory</text>
    <text x="548" y="76" fill="#9ca3af" font-size="10">SQLite + Core Facts + Vector Recall</text>

    <!-- Row 2 -->
    <rect x="20" y="92" width="372" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="32" y="109" fill="#f3f4f6" font-size="11" font-weight="500">Agent Loop &amp; ReflexionGuard</text>
    <text x="32" y="124" fill="#9ca3af" font-size="10">Gemini Multi-Hop ReAct, Failover, Decision Evaluator</text>

    <rect x="408" y="92" width="372" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="420" y="109" fill="#f3f4f6" font-size="11" font-weight="500">Tools, Headless Browser &amp; Scheduler</text>
    <text x="420" y="124" fill="#9ca3af" font-size="10">Web Search, SPA Fetcher, Cron/Reminder &amp; URL Watcher</text>
  </g>

  <!-- Arrow down -->
  <line x1="430" y1="276" x2="430" y2="312" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="299" fill="#64748b" font-size="10">Standardized CoreResponse</text>

  <!-- 3. Dispatch Layer -->
  <g transform="translate(30, 314)">
    <rect x="0" y="0" width="800" height="52" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="20" y="31" fill="#f9fafb" font-size="12" font-weight="600">Output Dispatch</text>
    <text x="190" y="31" fill="#cbd5e1" font-size="11">• Multi-Bubble Text &amp; Tempo</text>
    <text x="415" y="31" fill="#cbd5e1" font-size="11">• Sticker / Audio Sticker</text>
    <text x="615" y="31" fill="#cbd5e1" font-size="11">• Scheduled Alerts</text>
  </g>
</svg>
