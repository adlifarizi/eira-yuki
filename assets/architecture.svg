<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 1. Channel Adapters -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="24" y="35" fill="#f9fafb" font-size="13" font-weight="600">Channel Adapters</text>
    
    <rect x="220" y="14" width="220" height="32" rx="6" fill="#1f2937" stroke="#4b5563"/>
    <text x="235" y="34" fill="#e5e7eb" font-size="11">WhatsApp (Baileys)</text>

    <rect x="460" y="14" width="235" height="32" rx="6" fill="#1f2937" stroke="#374151" stroke-dasharray="3 3"/>
    <text x="475" y="34" fill="#9ca3af" font-size="11">Telegram / Web API (Pluggable)</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="90" x2="400" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="114" fill="#64748b" font-size="10">Normalized Message</text>

  <!-- 2. Eira Core Brain -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="720" height="120" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="24" y="30" fill="#60a5fa" font-size="13" font-weight="600">Eira Core Brain (Headless)</text>

    <!-- Sub-blocks -->
    <rect x="24" y="46" width="160" height="54" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="36" y="68" fill="#f3f4f6" font-size="11" font-weight="500">Gatekeeper &amp; Mood</text>
    <text x="36" y="86" fill="#9ca3af" font-size="10">Role &amp; Emotion State</text>

    <rect x="194" y="46" width="160" height="54" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="206" y="68" fill="#f3f4f6" font-size="11" font-weight="500">Hierarchical Memory</text>
    <text x="206" y="86" fill="#9ca3af" font-size="10">SQLite + Vector Recall</text>

    <rect x="364" y="46" width="165" height="54" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="376" y="68" fill="#f3f4f6" font-size="11" font-weight="500">Gemini LLM Provider</text>
    <text x="376" y="86" fill="#9ca3af" font-size="10">Function Calling &amp; Vision</text>

    <rect x="539" y="46" width="155" height="54" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="551" y="68" fill="#f3f4f6" font-size="11" font-weight="500">Tool Registry</text>
    <text x="551" y="86" fill="#9ca3af" font-size="10">Reminders, Notes, Search</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="250" x2="400" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="274" fill="#64748b" font-size="10">Structured Turn Result</text>

  <!-- 3. Dispatch Layer -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="720" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="24" y="30" fill="#f9fafb" font-size="12" font-weight="600">Output Dispatch</text>
    <text x="240" y="30" fill="#cbd5e1" font-size="11">• Text Stream / Reply</text>
    <text x="460" y="30" fill="#cbd5e1" font-size="11">• Contextual Sticker Reaction</text>
  </g>
</svg>